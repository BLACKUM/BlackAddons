plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'dev.kikugie.stonecutter'
}

def versionProps = [
    "26.1": [
        minecraft         : "26.1",
        loader            : "0.18.6",
        fabric            : "0.145.1+26.1",
        modmenu           : "18.0.0-alpha.8",
        clothConfigMrId   : "GFM8zh9J",   // maven.modrinth:cloth-config
        hypixelMrId       : "SlqCF6Or",   // maven.modrinth:hypixel-mod-api
        devauth           : "dev-auth-neo",
        fabricKotlin      : "1.13.10+kotlin.2.3.20"
    ],
    "26.1.1": [
        minecraft         : "26.1.1",
        loader            : "0.18.6",
        fabric            : "0.145.3+26.1.1",
        modmenu           : "18.0.0-alpha.8",
        clothConfigMrId   : "GFM8zh9J",   // maven.modrinth:cloth-config
        hypixelMrId       : "SlqCF6Or",   // maven.modrinth:hypixel-mod-api
        devauth           : "dev-auth-neo",
        fabricKotlin      : "1.13.10+kotlin.2.3.20"
    ]
]

def currentProps = versionProps[stonecutter.current.version]

project.ext.minecraft_version     = currentProps.minecraft
project.ext.loader_version        = currentProps.loader
project.ext.fabric_version        = currentProps.fabric
project.ext.modmenu_version       = currentProps.modmenu
project.ext.fabric_kotlin_version = currentProps.fabricKotlin

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_base_name}-${project.minecraft_version}"
}

loom {
    mods {
        "blackaddons" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "versions/${project.minecraft_version}/src/main/java"
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://repo.hypixel.net/repository/Hypixel/" }
    maven { url "https://repo.nea.moe/releases/" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.gegy.dev/releases/" }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    implementation("maven.modrinth:cloth-config:${currentProps.clothConfigMrId}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "maven.modrinth:hypixel-mod-api:${currentProps.hypixelMrId}"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "maven.modrinth:${currentProps.devauth}:VCy9sufW"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version"          : project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version"   : project.loader_version,
               "java_version"     : 25
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
    repositories {}
}
