name: Release BlackAddons

permissions:
  contents: write
  pull-requests: read
  issues: read

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (stable)'
        required: true
        default: 'stable'
        type: choice
        options:
        - stable

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - id: get_version
        run: |
          VERSION=$(grep "mod_version" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - id: set-matrix
        run: |
          echo "matrix=[\"1.21.10\", \"1.21.11\"]" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -Pmod_version=${{ needs.setup.outputs.version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.branch }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download New Artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      # Stable Release (Manual Dispatch)
      - name: Get Version
        id: get_version
        run: |
          VERSION=${{ needs.setup.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current version is $VERSION"

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## Changes" > changelog.md
          echo "" >> changelog.md
          
          if [ -z "$PREV_TAG" ]; then
            LOG_CMD="git log"
          else
            LOG_CMD="git log ${PREV_TAG}..HEAD"
          fi
          
          extract_commits() {
            local prefix=$1
            local title=$2
            local commits=$($LOG_CMD --no-merges -i --grep="^${prefix}" --pretty=format:"* %s (%h)" | sed -E "s/^\* ${prefix}(\([^)]+\))?:[[:space:]]*/* /i")
            if [ -n "$commits" ]; then
              echo "### $title" >> changelog.md
              echo "$commits" >> changelog.md
              echo "" >> changelog.md
            fi
          }
          
          extract_commits "feat" "Features"
          extract_commits "fix" "Bug Fixes"
          extract_commits "chore" "Chores"
          extract_commits "refactor" "Refactoring"
          extract_commits "docs" "Documentation"
          
          OTHER_COMMITS=$($LOG_CMD --no-merges --invert-grep -i --grep="^feat" --grep="^fix" --grep="^chore" --grep="^refactor" --grep="^docs" --pretty=format:"* %s (%h)")
          if [ -n "$OTHER_COMMITS" ]; then
            echo "### Other Changes" >> changelog.md
            echo "$OTHER_COMMITS" >> changelog.md
            echo "" >> changelog.md
          fi
          
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ env.VERSION }}" >> changelog.md
          fi
          
          cat changelog.md

      - name: Create Stable Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "v${{ env.VERSION }}"
          prerelease: false
          body_path: changelog.md
          files: artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version
        run: |
          python3 scripts/bump_version.py
        
      - name: Commit & Push Version Bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump version"
          file_pattern: gradle.properties

